<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Accès réservé</title>
<link rel="stylesheet" href="/interface.css">
</head>
<body>

<!-- CE FICHIER EST PUBLIC, ET IL NE DIT RIEN.
     Qui demande cette adresse sans la clé obtient une page qui ne nomme ni ce que fait l'outil, ni ce
     qu'il y a derrière. Les libellés qui le décrivent sont rendus par le serveur APRÈS la clé : les
     déplacer derrière un `hidden` n'aurait rien caché du tout, puisque le source se lit. -->

<header>
  <h1 id="titre">Accès réservé</h1>
  <p class="chapeau" id="chapeau" hidden></p>
</header>

<main>

  <!-- ÉCRAN 0 — la clé partagée. -->
  <section id="ecran-acces" hidden>
    <form id="form-acces">
      <label for="cle">Clé d'accès</label>
      <input type="password" id="cle" name="cle" autocomplete="off" required>
      <button type="submit" class="principal">Continuer</button>
    </form>
    <p id="attente-acces" class="attente" role="status" hidden>Vérification…</p>
    <p id="erreur-acces" class="erreur" role="alert" hidden></p>
  </section>

  <!-- ÉCRAN 1 — le jeton personnel. -->
  <section id="ecran-jeton" hidden>
    <p id="invite-jeton"></p>
    <form id="form-jeton">
      <label for="jeton">Jeton personnel — 64 caractères</label>
      <input type="password" id="jeton" name="jeton" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" required>
      <p class="precision">Collez-le en entier, sans espace. Il vous a été remis une seule fois :
      s'il est perdu, il ne se retrouve pas, il s'en demande un nouveau.</p>
      <button type="submit" class="principal">Entrer</button>
    </form>
    <p id="attente-jeton" class="attente" role="status" hidden>Vérification…</p>
    <p id="erreur-jeton" class="erreur" role="alert" hidden></p>
  </section>

  <!-- ÉCRAN 2 — la demande. -->
  <section id="ecran-demande" hidden>

    <details class="aide" id="aide" hidden>
      <summary>Comment ça marche</summary>
      <ul id="aide-points"></ul>
    </details>

    <form id="form-demande">
      <label for="adresses">Adresses, une par ligne</label>
      <textarea id="adresses" name="adresses" rows="6" spellcheck="false"></textarea>

      <label for="jours">Le lien reste valable pendant</label>
      <div class="ligne">
        <input type="number" id="jours" name="jours" value="15" min="1" max="365" inputmode="numeric">
        <span>jours</span>
      </div>
      <p class="precision">15 jours par défaut. Entre 1 et 365.</p>

      <button type="submit" class="principal" id="bouton-creer">Créer les liens</button>
    </form>

    <p id="attente" class="attente" role="status" hidden></p>
    <p id="erreur-demande" class="erreur" role="alert" hidden></p>

    <div id="resultats" aria-live="polite"></div>
  </section>

</main>

<footer>
  <p id="pied" hidden></p>
  <p id="ligne-sortie" hidden><button type="button" id="bouton-sortie" class="discret">Fermer la session</button></p>
</footer>

<script src="/interface.js" type="module"></script>
</body>
</html>
